[package]
name = "pg-studio"
version = "0.4.0"
edition = "2021"

[lib]
name = "pg_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
tauri-plugin-dialog = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"
russh = "0.65.0"

# Passwords live in the OS credential store; each platform needs its own backend feature.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
