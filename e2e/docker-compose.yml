# End-to-end environment. Everything runs in containers on a private network: no ports are published and
# nothing of the host (display, keychain, D-Bus, app data, node_modules, installed browsers) is used, so a
# run behaves the same on any machine. Run it with ./run.sh.
#
# The one exception is `build.network: host`: image builds only download packages (apt, crates, npm), and
# Docker's default bridge cannot resolve names on some hosts (WSL, some corporate DNS). Running the
# containers does not touch the host network.
name: pgstudio-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-secret
    volumes:
      - ./fixtures/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SSH server that can reach `postgres` (for the tunnel tests). Writes its test client keys to /keys.
  bastion:
    build:
      context: ./docker/bastion
      network: host
    volumes:
      - ssh-keys:/keys
    healthcheck:
      test: ["CMD-SHELL", "test -f /keys/.ready && nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The app's real Rust commands (SQLite, Postgres, SSH tunnel, vault) behind HTTP, on Tauri's mock runtime.
  backend:
    build:
      context: ..
      dockerfile: e2e/docker/backend.Dockerfile
      network: host
    environment:
      PG_STUDIO_DATA_DIR: /data
      E2E_BIND: 0.0.0.0
    tmpfs:
      - /data
    volumes:
      - ssh-keys:/keys:ro
    depends_on:
      bastion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:1430/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The production frontend bundle.
  web:
    build:
      context: ..
      dockerfile: e2e/docker/web.Dockerfile
      network: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ..
      dockerfile: e2e/docker/tests.Dockerfile
      network: host
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      E2E_WEB_URL: http://web
      E2E_API_URL: http://backend:1430
    volumes:
      - ./reports:/e2e/reports
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  ssh-keys:
